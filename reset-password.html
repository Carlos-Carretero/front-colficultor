<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Colficultor</title>
    <link rel="stylesheet" href="./css/reset-password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <main>
        <section class="reset-container">
            <article class="reset-form">
                <section class="titulo">
                    <h2>Restablecer contraseña</h2>
                    <p>Ingresa tu nueva contraseña segura</p>
                </section>

                <form id="resetPasswordForm">
                    <div class="input-group">
                        <label for="newPassword">Nueva Contraseña</label>
                        <input type="password" id="newPassword" placeholder="Mínimo 8 caracteres" required>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" placeholder="Repite la contraseña" required>
                        <div class="error-message" id="confirmError"></div>
                    </div>

                    <button type="submit" id="submitBtn">
                        <i class="fas fa-key"></i>
                        Restablecer Contraseña
                    </button>
                </form>

                <section class="back-to-login">
                    <a href="index.html">
                        <i class="fas fa-arrow-left"></i>
                        Volver al inicio
                    </a>
                </section>
            </article>
        </section>
    </main>

    <script src="./js/reset-password.js"></script>
</body>
</html></content>
